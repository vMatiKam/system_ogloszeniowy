{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 fw-bold">Logowanie</h3>

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-bold">Nazwa użytkownika:</label>
                        <input type="text" name="username" id="id_username" class="form-control" placeholder="Wpisz nazwę użytkownika" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-bold">Hasło:</label>
                        <input type="password" name="password" id="id_password" class="form-control" placeholder="Wpisz hasło" required>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Zaloguj się</button>
                    </div>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <small class="text-muted">Nie masz jeszcze konta? <a href="{% url 'register' %}" class="fw-bold text-decoration-none">Zarejestruj się</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
