{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Rejestracja konta</h3>
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 mt-3">Zarejestruj się</button>
                </form>
                <div class="text-center mt-3">
                    <small>Masz już konto? <a href="{% url 'login' %}">Zaloguj się</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
