{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm p-4">
            <h4 class="text-danger mb-3">Czy na pewno chcesz usunąć to ogłoszenie?</h4>
            <p><strong>{{ listing.title }}</strong></p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger me-2">Tak, usuń</button>
                <a href="{% url 'my_listings' %}" class="btn btn-secondary">Anuluj</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
