{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">Edytuj ogłoszenie: {{ listing.title }}</h3>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Zapisz zmiany</button>
                    <a href="{% url 'my_listings' %}" class="btn btn-link w-100 mt-1 text-center">Anuluj</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
